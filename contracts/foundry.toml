[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
verbosity = 2

# Remappings
remappings = [
    "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
reactive_kopli = "https://kopli-rpc.reactive.network"
sepolia = "https://rpc.sepolia.org"
localhost = "http://127.0.0.1:8545"

